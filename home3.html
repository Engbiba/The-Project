    <center>
        <h2>نموذج الطلب</h2>

        <p>
            من فضلك أدخل بياناتك لإعداد طلبك.
        </p>
    </center>

    <form action="#" method="post">

        <table align="center" cellpadding="8">

            <tr>
                <td>
                    <label for="name">الاسم بالكامل:</label>
                </td>

                <td>
                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="اكتب اسمك"
                           required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="phone">رقم الهاتف:</label>
                </td>

                <td>
                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="01XXXXXXXXX"
                           required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="email">البريد الإلكتروني:</label>
                </td>

                <td>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="example@gmail.com">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="fabric">اختر نوع القماش:</label>
                </td>

                <td>
                    <select id="fabric" name="fabric">

    <option value="cotton">القطن (Cotton)</option>

    <option value="linen">الكتان (Linen)</option>

    <option value="silk">الحرير (Silk)</option>

    <option value="denim">الجينز (Denim)</option>

    <option value="wool">الصوف (Wool)</option>

    <option value="chiffon">الشيفون (Chiffon)</option>

    <option value="satin">الستان (Satin)</option>

    <option value="velvet">المخمل (Velvet)</option>

    <option value="crepe">الكريب (Crepe)</option>

    <option value="lace">الدانتيل (Lace)</option>

    <option value="tulle">التل (Tulle)</option>

    <option value="organza">الأورجانزا (Organza)</option>

    <option value="viscose">الفيسكوز (Viscose)</option>

</select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="quantity">الكمية بالمتر:</label>
                </td>

                <td>
                    <input type="number"
                           id="quantity"
                           name="quantity"
                           min="1"
                           required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="address">عنوان التوصيل:</label>
                </td>

                <td>
                    <input type="text"
                           id="address"
                           name="address"
                           placeholder="اكتب عنوانك">
                </td>
            </tr>

            <tr>
                <td>
                    <label for="notes">ملاحظات إضافية:</label>
                </td>

                <td>
                    <textarea id="notes"
                              name="notes"
                              rows="5"
                              cols="25"
                              placeholder="اكتب ملاحظاتك هنا">
                    </textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <center>

                        <input type="submit"
                               value="إرسال الطلب">

                        <input type="reset"
                               value="مسح البيانات">

                    </center>
                </td>
            </tr>

        </table>

    </form>

    <hr>

    <center>
        <p>
            لمزيد من المعلومات يمكنك
